# 「阿B听书·改」自用改造版云端构建。
# 用法：把本仓库 push 上来（或在 Actions 页手动 Run workflow）→
#       等构建完成 → 该次运行页面底部 Artifacts 里下载 abts-custom-apk。
# 包名已是 dev.pages.abts.custom，可与官方版同时安装，不需要卸载。
# 注意：仓库没有 key.properties，产物用 debug 签名；每次 CI 生成的
#       debug 证书不同，重装新包若提示「应用未安装」需先卸载旧包。
name: Build 阿B听书·改 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 打印工具链，便于首次构建失败时定位版本不匹配
      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: pub get
        run: flutter pub get

      # 按 ABI 分包，手机一般只需要 arm64-v8a 那个（体积最小）
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abts-custom-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show outputs
        run: ls -lh build/app/outputs/flutter-apk/*.apk
