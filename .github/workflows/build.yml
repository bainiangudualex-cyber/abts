# 「阿B听书 · 滑轨倍速版」云端构建
#
# 基线 = 原版 fengqiao57/abts v1.2.2，代码只改一处：
#   lib/pages/player_page.dart 的 _showSpeedSheet —— 档位列表换成滑轨，
#   0.05x 一档（0.5x ~ 3.0x）。其余文件与原版逐字节一致。
#
# ⚠️ 必须锁 Flutter 3.38.10（Dart 3.10.9）：
#    原版 pubspec 要求 sdk ^3.10.8，且依赖 umeng_common_sdk 1.3.x。
#    用当前 stable（3.47.x / Dart 3.13）会在 :umeng_common_sdk:compileReleaseKotlin
#    因新版 Kotlin 不兼容而失败。锁版本 = 不必删依赖、不必改任何业务代码。
name: Build 阿B听书 倍速版

on:
  workflow_dispatch:
  push:
    branches: [main]

# 发 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: pub get
        run: flutter pub get

      # 只出 arm64 单包（约 40MB），绝大多数手机都是 arm64-v8a
      - name: Build release APK (arm64 only)
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk abts-speed-arm64.apk
          ls -lh abts-speed-arm64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: abts-speed-apk
          path: abts-speed-arm64.apk
          if-no-files-found: error
          retention-days: 30

      # Release asset 是公开直链，手机浏览器可直接下载、支持断点续传。
      # 注意：--clobber 只属于 gh release upload，create 没有这个 flag。
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.2.2-speed
          APK: abts-speed-arm64.apk
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 覆盖上传"
            gh release upload "$TAG" "$APK" --clobber
          else
            echo "Release $TAG 不存在 → 新建"
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "阿B听书 · 滑轨倍速版" \
              --notes "原版 v1.2.2 基线，仅改一处：倍速弹窗由档位列表改为滑轨拖动，0.05x 一档（0.5x ~ 3.0x）。拖动能实时听到快慢变化，松手落定。包名 dev.pages.abts.custom，可与官方版共存。"
          fi
          echo "下载地址：$(gh release view "$TAG" --json url -q .url)"
